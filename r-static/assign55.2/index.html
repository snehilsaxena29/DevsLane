<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <div class="w-full p-10">
    <div class="flex gap-8 bg-white p-6">

      <!-- Image Section -->
      <div class="w-[520px] p-8 flex items-center justify-center">
        <img
          src="https://codeyogi.io/coffee-mug.jpeg"
          alt="Black Printed Coffee Mug"
          class="w-[460px] h-[460px] object-cover shadow-inner"
        />
      </div>

      <!-- Content Section -->
      <div class="w-[520px] pl-8 mt-6">
        <h1 class="text-[40px] text-gray-700">
          Black Printed Coffee Mug
        </h1>

        <p class="mt-6 text-2xl font-bold text-gray-800">
          $15.00
        </p>

        <p class="mt-6 text-gray-600 leading-8 max-w-[420px]">
          Lorem ipsum dolor sit amet, consectetur adipisicing elit.
          Necessitatibus dolorum aliquid alias nesciunt quaerat, odio
          doloribus aspernatur ullam officiis ratione hic labore ipsam
          assumenda ducimus pariatur quas porro praesentium dolores!
        </p>

        <!-- Quantity + Button -->
        <div class="mt-8 flex items-center gap-4">
          <div class="w-full flex gap-2 items-center">
            <span class="border border-gray-300 px-5 py-4">
              0
            </span>

            <button class="border border-gray-300 p-3">
              +
            </button>

            <button class="h-12 px-8 bg-red-500 text-white font-semibold rounded-md shadow-md">
              ADD TO CART
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
